services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - path: ./api/.env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_FILE=/run/secrets/api_jwt_secret
      - JWT_REFRESH_SECRET_FILE=/run/secrets/api_refresh_secret
      - EMAIL_VERIFICATION_JWT_SECRET_FILE=/run/secrets/api_email_verification_secret
      - PASSWORD_RESET_JWT_SECRET_FILE=/run/secrets/api_password_reset_secret
      - NOTIFICATION_SOCKET_SERVICE_TOKEN_FILE=/run/secrets/notification_socket_service_token
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=marcoreda51@gmail.com
      - SMTP_PASS_FILE=/run/secrets/api_smtp_pass
      - SMTP_FROM=DocuMind AI <marcoreda51@gmail.com>
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:3000}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:5000}
      - SUPER_ADMIN_BOOTSTRAP_KEY_FILE=/run/secrets/api_super_admin_bootstrap_key
      - STRIPE_SECRET_KEY_FILE=/run/secrets/stripe_secret_key
      - STRIPE_WEBHOOK_SECRET_FILE=/run/secrets/stripe_webhook_secret
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-http://localhost:3000/checkout/success}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-http://localhost:3000/checkout/cancel}
      - STRIPE_BILLING_PORTAL_RETURN_URL=${STRIPE_BILLING_PORTAL_RETURN_URL:-http://localhost:3000/dashboard/settings/billing}
      - STRIPE_BILLING_PORTAL_GENERAL_CONFIGURATION_ID=${STRIPE_BILLING_PORTAL_GENERAL_CONFIGURATION_ID:-}
      - STRIPE_BILLING_PORTAL_PAYMENT_METHOD_CONFIGURATION_ID=${STRIPE_BILLING_PORTAL_PAYMENT_METHOD_CONFIGURATION_ID:-}
      - BILLING_PORTAL_ALLOWED_ORIGIN=${BILLING_PORTAL_ALLOWED_ORIGIN:-http://localhost:3000}
      - BILLING_PAST_DUE_GRACE_DAYS=${BILLING_PAST_DUE_GRACE_DAYS:-7}
      - BILLING_GOODWILL_REFUND_CAP_MINOR=${BILLING_GOODWILL_REFUND_CAP_MINOR:-0}
      - SEND_EMAILS=true
      - ENABLE_SUPER_ADMIN_BOOTSTRAP=true
      - SEED_SUPER_ADMIN_ENABLED=true
      - SEED_PLATFORM_TENANT_NAME=DocuMind AI
      - SEED_PLATFORM_TENANT_SLUG=documind.ai
      - SEED_SUPER_ADMIN_NAME=DocuMind Platform Admin
      - SEED_SUPER_ADMIN_EMAIL=superadmin@documind.ai
      - SEED_SUPER_ADMIN_PASSWORD=DocuMind@2026
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - LLM_PRIMARY_PROVIDER=${LLM_PRIMARY_PROVIDER:-iti-bedrock}
      - SBG_API_KEY=${SBG_API_KEY}
      - ITI_BEDROCK_BASE_URL=${ITI_BEDROCK_BASE_URL:-http://host.docker.internal:8787/v1}
      - ITI_BEDROCK_MODEL=${ITI_BEDROCK_MODEL:-deepseek.v3.2}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-groq}
      - BEDROCK_TIMEOUT_MS=${BEDROCK_TIMEOUT_MS:-30000}
      - BEDROCK_MAX_RETRIES=${BEDROCK_MAX_RETRIES:-1}
      - BEDROCK_RETRY_DELAY_MS=${BEDROCK_RETRY_DELAY_MS:-500}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_STT_API_KEY=${GROQ_STT_API_KEY}
      - GROQ_CHAT_MODEL=openai/gpt-oss-120b
      - JINA_API_KEY=${JINA_API_KEY}
      - JINA_EMBEDDING_MODEL=jina-embeddings-v3
      - JINA_EMBEDDING_DIMENSIONS=1024
      - SBG_BASE_URL=${SBG_BASE_URL:-http://apiaccess.iti.net.eg}

      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - AWS_REGION=${AWS_REGION:-eu-north-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-documind-storage-abdallah}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    secrets:
      - api_jwt_secret
      - api_refresh_secret
      - api_email_verification_secret
      - api_password_reset_secret
      - notification_socket_service_token
      - api_smtp_pass
      - api_super_admin_bootstrap_key
      - stripe_secret_key
      - stripe_webhook_secret
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:5000/readyz'').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
    volumes:
      - ./api:/repo/api
      - api_node_modules:/repo/api/node_modules

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('node:net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.setTimeout(3000,()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));",
        ]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 60s
    volumes:
      - ./app:/repo/app
      - app_node_modules:/repo/app/node_modules
      - /repo/app/.next

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./workers:/repo/workers
      - worker_node_modules:/repo/workers/node_modules
      - ./api/uploads:/repo/api/uploads
    env_file:
      - path: ./workers/.env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_URL_FILE=/run/secrets/worker_redis_url
      - UPLOAD_DIR=/repo/api/uploads
      - SMTP_PASS_FILE=/run/secrets/api_smtp_pass
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=marcoreda51@gmail.com
      - SMTP_FROM=marcoreda51@gmail.com
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:3000}
      - NOTIFICATION_TRANSPORT=socket
      - NOTIFICATION_SOCKET_URL=http://api:5000
      - NOTIFICATION_SOCKET_SERVICE_TOKEN_FILE=/run/secrets/notification_socket_service_token
      - EMAIL_VERIFICATION_JWT_SECRET_FILE=/run/secrets/api_email_verification_secret
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - LLM_PRIMARY_PROVIDER=${LLM_PRIMARY_PROVIDER:-iti-bedrock}
      - SBG_API_KEY=${SBG_API_KEY}
      - ITI_BEDROCK_BASE_URL=${ITI_BEDROCK_BASE_URL:-http://host.docker.internal:8787/v1}
      - ITI_BEDROCK_MODEL=${ITI_BEDROCK_MODEL:-deepseek.v3.2}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-groq}
      - BEDROCK_TIMEOUT_MS=${BEDROCK_TIMEOUT_MS:-8000}
      - BEDROCK_MAX_RETRIES=${BEDROCK_MAX_RETRIES:-1}
      - BEDROCK_RETRY_DELAY_MS=${BEDROCK_RETRY_DELAY_MS:-500}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_CHAT_MODEL=llama-3.3-70b-versatile
      - JINA_API_KEY=${JINA_API_KEY}
      - JINA_EMBEDDING_MODEL=jina-embeddings-v3
      - JINA_EMBEDDING_DIMENSIONS=1024
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - AWS_REGION=${AWS_REGION:-eu-north-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-documind-storage-abdallah}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    secrets:
      - api_smtp_pass
      - api_email_verification_secret
      - notification_socket_service_token
      - worker_redis_url

  redis:
    image: redis:7
    container_name: docsai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  uploads_data:
  api_node_modules:
  worker_node_modules:
  app_node_modules:

secrets:
  api_jwt_secret:
    file: ./secrets/api_jwt_secret.txt
  api_refresh_secret:
    file: ./secrets/api_refresh_secret.txt
  api_email_verification_secret:
    file: ./secrets/api_email_verification_secret.txt
  api_password_reset_secret:
    file: ./secrets/api_password_reset_secret.txt
  api_smtp_pass:
    file: ./secrets/api_smtp_pass.txt
  notification_socket_service_token:
    file: ./secrets/notification_socket_service_token.txt
  api_super_admin_bootstrap_key:
    file: ./secrets/api_super_admin_bootstrap_key.txt
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret.txt
  worker_redis_url:
    file: ./secrets/worker_redis_url.txt
